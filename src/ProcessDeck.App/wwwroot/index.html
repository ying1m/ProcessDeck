<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!--
    CSP 说明：
      default-src 'none' 是基线，其余逐项开口。
      frame-src 必须显式列出，否则它会回落到 default-src 'none'，
      自定义卡片会因为「已阻止此内容」而加载失败。
      'self' 覆盖内置卡片（processdeck.local），
      第二个源覆盖用户卡片（映射到 %APPDATA%\ProcessDeck\cards 的虚拟主机）。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; font-src 'self'; frame-src 'self' https://processdeck-cards.local" />
  <title>ProcessDeck</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">ProcessDeck</span>
      <span class="brand-sub">进程面板</span>
    </div>
    <div class="summary" id="summary"></div>
    <div class="topbar-actions">
      <select class="btn" id="card-picker" title="切换面板卡片"></select>
      <button class="btn ghost" id="btn-theme">切换主题</button>
      <button class="btn primary" id="btn-add">+ 添加应用</button>
    </div>
  </header>

  <main class="board" id="board"></main>

  <!--
    自定义卡片宿主。
    sandbox 只给 allow-scripts，刻意不给 allow-same-origin：
    卡片文档因此获得不透明源，拿不到父页面 DOM / cookie / localStorage，
    只能通过 postMessage 走白名单 API。
  -->
  <section class="card-host" id="card-host" hidden>
    <iframe id="card-frame" sandbox="allow-scripts" title="自定义卡片"></iframe>
  </section>

  <footer class="statusbar">
    <span id="engine-state">引擎：未连接（面板骨架阶段）</span>
    <span class="spacer"></span>
    <span id="port-watch">端口监控：待接入</span>
    <span class="spacer"></span>
    <span id="viewport" class="mono"></span>
  </footer>

  <!-- 新建 / 编辑应用表单 -->
  <div class="modal-backdrop" id="app-form" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="app-form-title">
      <header class="modal-head">
        <h2 id="app-form-title">新建应用</h2>
        <button class="btn tiny ghost" id="app-form-close" title="关闭">✕</button>
      </header>

      <div class="modal-body">
        <label class="field" id="field-template">
          <span>从模板快速开始</span>
          <select id="f-template"></select>
        </label>

        <label class="field">
          <span>名称 <b class="req">*</b></span>
          <input id="f-name" type="text" placeholder="例如：前端 dev server" />
        </label>

        <label class="field">
          <span>说明</span>
          <input id="f-description" type="text" placeholder="可选，显示在卡片上" />
        </label>

        <label class="field">
          <span>启动命令 <b class="req">*</b></span>
          <textarea id="f-start" rows="2" spellcheck="false"
                    placeholder="原样交给系统执行，不做转义改写。例如：cmd.exe /c pnpm dev"></textarea>
        </label>

        <label class="field">
          <span>停止命令</span>
          <textarea id="f-stop" rows="2" spellcheck="false"
                    placeholder="可选。留空则停止时先尝试 Ctrl+C，最后强制回收"></textarea>
        </label>

        <label class="field">
          <span>工作目录</span>
          <input id="f-cwd" type="text" spellcheck="false"
                 placeholder="可选，支持 %USERPROFILE% 这类环境变量" />
        </label>

        <div class="field-row">
          <label class="field">
            <span>端口</span>
            <input id="f-port" type="number" min="1" max="65535" placeholder="可选" />
          </label>
          <label class="field">
            <span>优雅停止超时（秒）</span>
            <input id="f-stoptimeout" type="number" min="1" max="600" value="15" />
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span>就绪判定</span>
            <select id="f-readiness">
              <option value="None">进程存活即可</option>
              <option value="Port">端口开始监听</option>
              <option value="Http">HTTP 返回成功</option>
              <option value="Log">终端输出匹配</option>
            </select>
          </label>
          <label class="field">
            <span>就绪超时（秒）</span>
            <input id="f-timeout" type="number" min="1" max="1800" value="60" />
          </label>
        </div>

        <label class="field" id="field-url" hidden>
          <span>健康检查地址</span>
          <input id="f-url" type="text" spellcheck="false" placeholder="http://127.0.0.1:8080/health" />
        </label>

        <label class="field" id="field-pattern" hidden>
          <span>日志匹配正则</span>
          <input id="f-pattern" type="text" spellcheck="false" placeholder="listening on|ready in" />
        </label>

        <label class="field checkbox">
          <input id="f-autostart" type="checkbox" />
          <span>ProcessDeck 启动时自动拉起</span>
        </label>
      </div>

      <footer class="modal-foot">
        <button class="btn tiny danger" id="app-form-delete" hidden>删除</button>
        <span class="spacer"></span>
        <button class="btn tiny" id="app-form-cancel">取消</button>
        <button class="btn tiny primary" id="app-form-save">保存</button>
      </footer>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
